services:

  # ── Backend (Spring Boot) ──────────────────────────────────────
  - type: web
    name: internite-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health/render

    envVars:
      # ── MongoDB Atlas (set in Render dashboard) ────────────────
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: nexacrm

      # ── Security ───────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true

      # ── CORS (frontend origin + credentialed requests) ─
      # If Render gives the frontend a different onrender.com address, update it here.
      - key: CORS_ORIGINS
        value: "https://internite-frontend-5z1q.onrender.com"
      - key: CORS_ALLOW_CREDENTIALS
        value: "true"
      - key: AUTH_COOKIE_SECURE
        value: "true"

      # ── Twilio (set manually in Render dashboard) ──────────────
      # TwiML App Voice URL: https://internite-backend-5z1q.onrender.com/api/calls/twilio/voice
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBERS
        sync: false
      - key: TWILIO_DEFAULT_FROM_NUMBER
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_TWIML_APP_SID
        sync: false
      - key: TWILIO_STATUS_CALLBACK_BASE_URL
        value: https://internite-backend-5z1q.onrender.com

      # Public links sent out (e.g. pipeline PDF in WhatsApp digests) point at the frontend.
      - key: PUBLIC_BASE_URL
        value: https://internite-frontend-5z1q.onrender.com

      # ── Facebook / Meta (set manually in Render dashboard) ──────
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WEBHOOK_TOKEN
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_PAGE_ID
        sync: false

      # ── Email SMTP (set manually in Render dashboard) ────────────
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

      # ── WhatsApp (set manually in Render dashboard) ──────────────
      - key: AIADRIKA_BASE_URL
        sync: false
      - key: AIADRIKA_INSTANCE_ID
        sync: false
      - key: AIADRIKA_ACCESS_TOKEN
        sync: false

  # ── Frontend (React / Vite static site) ───────────────────────
  - type: web
    name: internite-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    envVars:
      - key: VITE_API_BASE_URL
        value: /api
      # Static-site rewrites cannot carry WebSocket upgrades, so live notifications go straight to the backend.
      - key: VITE_WS_URL
        value: wss://internite-backend-5z1q.onrender.com/ws
      - key: VITE_API_TIMEOUT_MS
        value: "45000"
      - key: VITE_LOGIN_TIMEOUT_MS
        value: "60000"

    routes:
      # Proxy API calls to the backend so the browser sees one origin (login cookies keep working).
      # If Render gives the backend a different onrender.com address, update it here and in VITE_WS_URL.
      - type: rewrite
        source: /api/*
        destination: https://internite-backend-5z1q.onrender.com/api/*
      # Serve index.html for all paths so React Router works
      - type: rewrite
        source: /*
        destination: /index.html
